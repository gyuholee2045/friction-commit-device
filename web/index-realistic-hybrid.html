<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Approval Gate — ring hybrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#2a3038; --ink-dim:#717a85; --ink-faint:#9aa3ad; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#eef1f6; color:var(--ink); font-family:var(--sans); font-weight:400; overflow:hidden; -webkit-font-smoothing:antialiased}
  #gl{position:fixed; inset:0; z-index:1; display:block}
  .info{position:fixed; left:0; right:0; top:0; z-index:3; display:flex; flex-direction:column; align-items:center; gap:8px; padding:7vh 24px 0; text-align:center; pointer-events:none}
  .eyebrow{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-faint)}
  .ititle{font-size:21px; font-weight:500; line-height:1.3; max-width:520px}
  .isub{font-size:14px; color:var(--ink-dim); max-width:430px; line-height:1.5}
  .zone{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:3; pointer-events:none}
  .cmask{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:2; width:26vh; height:26vh; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle closest-side, #eef1f6 0%, #eef1f6 46%, rgba(238,241,246,0) 82%)}
  .zone .z{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); transition:color .4s}
  .ui{position:fixed; left:0; right:0; bottom:0; z-index:3; display:flex; justify-content:center; padding:5vh 24px; text-align:center; pointer-events:none}
  .reveal{font-size:18px; line-height:1.55; min-height:52px; max-width:460px; color:var(--ink); opacity:.92; transition:opacity .4s ease}
  #hit{position:fixed; left:50%; top:50%; width:280px; height:280px; transform:translate(-50%,-50%); border-radius:50%; z-index:4; cursor:pointer; touch-action:none}
  .stepbar{position:fixed; left:50%; bottom:15vh; transform:translateX(-50%); z-index:3; display:flex; gap:4px; pointer-events:none}
  .stepbar span{display:block; width:80px; height:2px; border-radius:2px; background:rgba(0,0,0,0.22); overflow:hidden}
  .stepbar i{display:block; height:100%; width:0%; background:rgba(255,255,255,0.95); border-radius:2px}
  .fallback{position:fixed; inset:0; z-index:5; display:none; align-items:center; justify-content:center; color:#888; font-size:14px; padding:40px; text-align:center}
  .badge{position:fixed; left:16px; bottom:14px; z-index:6; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); pointer-events:none}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="cmask"></div>
  <div class="info">
    <div class="eyebrow">The Approval Gate</div>
    <h1 class="ititle">An AI is about to send an email for you.</h1>
    <p class="isub">Hold to see who it reaches, then decide.</p>
  </div>
  <div class="zone"><span class="z" id="zone">Hold to stay</span></div>
  <div class="stepbar" id="stepbar"><span><i></i></span><span><i></i></span><span><i></i></span></div>
  <div class="ui"><div class="reveal" id="reveal">Hold on a second. Let me show you who this really reaches.</div></div>
  <div id="hit"></div>
  <div class="badge">HYBRID · swelling body + calm surface</div>
  <div class="fallback" id="fallback">This experience needs WebGL.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ═══════════════════════════════════════════════════════════════════
   REALISM NOTES (what changed vs index.html)
   1. three r180 — dispersion needs r167+, transmissionResolutionScale needs r173+;
      the dispersion:1.4 in the old r165 build was silently ignored.
   2. Analytic normals — the wobble is re-differentiated per vertex, so the
      surface SHADES like moving liquid instead of a smooth rubber donut.
   3. Custom studio environment (softbox strips) → long sliding speculars.
   4. Rich backdrop + projected caustics → refraction has something to bend.
   5. transmissionResolutionScale = 1 → crisp refraction, not half-res mush.
   6. OutputPass → ACES tone map + sRGB applied once, correctly, at the end.
   ═══════════════════════════════════════════════════════════════════ */

const reveal=document.getElementById('reveal'), zone=document.getElementById('zone'), hit=document.getElementById('hit');
const stepFills=Array.prototype.slice.call(document.querySelectorAll('#stepbar i'));
const SEGS=[
  {label:'Reach',      color:'#5a6a8a', text:'This reaches 340 people.'},
  {label:'Recipients', color:'#5a6a8a', text:'12 are external. 3 are executives you cannot reply to.'},
  {label:'No undo',    color:'#3a47c0', text:'Finish, and it goes. There is no taking it back.'}
];
const ABORTS=[
  'It is okay. Nothing went out.',
  'You stepped back. It is still just a draft.',
  'Good pause. No one received anything.',
  'You let go, and that was the right call.',
  'Nothing happened. You can always send it later.',
  'Take your time. It will be here when you are ready.'
];
let abortIx=0;
function segDur(){ return [1200,1200,2000+Math.min(streak,4)*500]; }
function stageOf(p){ return p<0.30?0:p<0.60?1:2; }
function prog(el,d){ const T0=d[0],T1=d[0]+d[1];
  if(el<T0) return 0.30*(el/d[0]); if(el<T1) return 0.30+0.30*((el-T0)/d[1]); return 0.60+0.40*Math.min((el-T1)/d[2],1); }
function setText(el,t){ el.style.opacity='0'; setTimeout(()=>{el.textContent=t; el.style.opacity='.92';},180); }

function softTex(){ const s=128,c=document.createElement('canvas'); c.width=c.height=s; const g=c.getContext('2d');
  const rad=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  rad.addColorStop(0,'rgba(255,255,255,1)'); rad.addColorStop(0.4,'rgba(255,255,255,0.5)'); rad.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rad; g.fillRect(0,0,s,s); return new THREE.CanvasTexture(c); }

const STOPS=['#2730c6','#5a3ad0','#2f8fd0'].map(h=>new THREE.Color(h));
function colorAt(f){ f=(f%1+1)%1; const n=STOPS.length, x=f*n, i=Math.floor(x), t=x-i; return STOPS[i%n].clone().lerp(STOPS[(i+1)%n],t); }

const R=0.48, TUBE=0.118, CTUBE=0.050, SMOKE=54;
let renderer,scene,camera,composer,finishPass,bloomPass,torus,mat,core,clock,group,smoke,smokePos,smokeMat,caustic;
const smokeVel=[];
let state='idle', press=0, fillV=0, holdStart=0, spreadStart=0, streak=0, lastStage=-1;
let rippleActive=false, rippleT=0;
const pointer={x:0,y:0}, rot={x:0,y:0};

/* ── shared GLSL: 3D value noise + fbm ───────────────────────────── */
const NOISE=`
float hash31(vec3 p){ p=fract(p*0.3183099+vec3(0.11,0.17,0.23)); p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i+vec3(0,0,0)),hash31(i+vec3(1,0,0)),f.x),
                 mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),f.x),
                 mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),f.x),f.y),f.z)*2.0-1.0; }
float fbm3(vec3 p){ float a=0.5,s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
`;

/* ── water torus: displacement + ANALYTIC normals ─────────────────
   The whole point: surf(u,v) is a real parametric surface, so we can
   finite-difference it and hand the rasteriser a normal that actually
   matches the bumps. That is what makes it read as liquid.          */
function waterShader(material){
  const PRE=`
uniform float uTime; uniform float uFill; uniform float uAmp;
${NOISE}
const float uR=${R.toFixed(4)};
const float uT=${TUBE.toFixed(4)};
vec3 torusN(float u,float v){ float cu=cos(u),su=sin(u),cv=cos(v),sv=sin(v);
  return vec3(cv*cu, cv*su, sv); }
// Sampled on a circle so it wraps seamlessly round the ring.
float ringFbm(float u,float freq,float phase){
  return fbm3(vec3(cos(u)*freq, sin(u)*freq, phase)); }
float tubeAt(float u){
  // The BODY swells and thins as it travels. Without this the base
  // primitive stays a rigid pipe and the noise reads as texture bolted
  // on to it — the "tube forced into the waves" look.
  float swell = ringFbm(u-uTime*0.17, 1.7, 11.0)*0.20
              + ringFbm(u+uTime*0.10, 3.5, 27.0)*0.085;
  swell *= (1.0-uFill*0.80);            // pulled taut as it fills
  return uT*(1.0+uFill*0.24)*(1.0+swell+0.055*(-sin(u)));
}
vec3 torusP(float u,float v){ float cu=cos(u),su=sin(u),cv=cos(v),sv=sin(v);
  float t=tubeAt(u); float rr=uR*(1.0+uFill*0.045);
  return vec3((rr+t*cv)*cu, (rr+t*cv)*su, t*sv); }
float disp(vec3 P,float u,float v){
  // waves ride AROUND the ring instead of shimmering in place
  float a=u-uTime*0.32;
  float w1=fbm3(vec3(cos(a)*4.0, sin(a)*4.0, uTime*0.20+v*0.32));
  float w2=fbm3(P*4.5+vec3(uTime*0.90,-uTime*0.70,uTime*0.50));
  return (w1*0.80+w2*0.12)*uAmp*(1.0-uFill*0.80);
}
vec3 surf(float u,float v){ vec3 P=torusP(u,v); return P+torusN(u,v)*disp(P,u,v); }
`;
  material.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime={value:0}; sh.uniforms.uFill={value:0}; sh.uniforms.uAmp={value:0.017};
    material.userData.sh=sh;
    sh.vertexShader=PRE+sh.vertexShader;
    sh.vertexShader=sh.vertexShader.replace('#include <beginnormal_vertex>',`
      float _u=atan(position.y,position.x);
      vec3 _cd=vec3(cos(_u),sin(_u),0.0);
      vec3 _d=position-_cd*uR;
      float _v=atan(_d.z,dot(_d,_cd));
      vec3 _P0=surf(_u,_v);
      vec3 _N=normalize(cross(surf(_u+0.010,_v)-_P0, surf(_u,_v+0.010)-_P0));
      if(dot(_N,torusN(_u,_v))<0.0) _N=-_N;
      vec3 objectNormal=_N;
    `);
    sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','vec3 transformed=_P0;');
  };
}

/* ── inner coloured liquid: slower, more viscous, also analytic ──── */
function coreShader(material){
  const PRE=`
uniform float uTime; uniform float uThin; uniform float uAmp;
${NOISE}
const float uR=${R.toFixed(4)};
const float uT=${CTUBE.toFixed(4)};
vec3 torusN(float u,float v){ float cu=cos(u),su=sin(u),cv=cos(v),sv=sin(v);
  return vec3(cv*cu,cv*su,sv); }
vec3 torusP(float u,float v){ float cu=cos(u),su=sin(u),cv=cos(v),sv=sin(v);
  float t=uT*(1.0-uThin*0.97);
  return vec3((uR+t*cv)*cu,(uR+t*cv)*su,t*sv); }
float disp(vec3 P){ return fbm3(P*4.6+vec3(0.0,uTime*0.22,uTime*0.16))*uAmp*(1.0-uThin); }
vec3 surf(float u,float v){ vec3 P=torusP(u,v); return P+torusN(u,v)*disp(P); }
`;
  material.onBeforeCompile=(sh)=>{
    sh.uniforms.uTime={value:0}; sh.uniforms.uThin={value:0}; sh.uniforms.uAmp={value:0.006};
    material.userData.sh=sh;
    sh.vertexShader=PRE+sh.vertexShader;
    sh.vertexShader=sh.vertexShader.replace('#include <beginnormal_vertex>',`
      float _u=atan(position.y,position.x);
      vec3 _cd=vec3(cos(_u),sin(_u),0.0);
      vec3 _d=position-_cd*uR;
      float _v=atan(_d.z,dot(_d,_cd));
      vec3 _P0=surf(_u,_v);
      vec3 _N=normalize(cross(surf(_u+0.012,_v)-_P0, surf(_u,_v+0.012)-_P0));
      if(dot(_N,torusN(_u,_v))<0.0) _N=-_N;
      vec3 objectNormal=_N;
    `);
    sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','vec3 transformed=_P0;');
  };
}

/* ── caustics projected on the backdrop (additive) ────────────────── */
const CausticMat=()=>new THREE.ShaderMaterial({
  transparent:true, blending:THREE.AdditiveBlending, depthWrite:false,
  uniforms:{ uTime:{value:0}, uGain:{value:1.0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec2 vUv; uniform float uTime; uniform float uGain;
    float caus(vec2 uv,float t){
      vec2 p=mod(uv*6.28318,6.28318)-250.0; vec2 i=p; float c=1.0; const float inten=0.0045;
      for(int n=0;n<4;n++){ float tt=t*(1.0-(3.5/float(n+1)));
        i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
        c+=1.0/length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten))); }
      c/=4.0; c=1.17-pow(c,1.4); return pow(abs(c),7.0);
    }
    void main(){
      vec2 p=vUv-0.5; float r=length(p);
      float band=smoothstep(0.34,0.10,abs(r-0.155))*smoothstep(0.44,0.30,r);
      float c=caus(vUv*2.6,uTime*0.5)+0.55*caus(vUv*4.7+13.0,uTime*0.34);
      gl_FragColor=vec4(vec3(0.42,0.60,0.95)*c*band*uGain, 1.0);
    }`
});

/* ── final grade: commit ripple + chromatic aberration + vignette + grain ── */
const FinishShader={
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uActive:{value:0}, uAspect:{value:1}, uClock:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uTime; uniform float uActive; uniform float uAspect; uniform float uClock;
    varying vec2 vUv;
    void main(){
      vec2 uv=vUv; float dark=0.0;
      if(uActive>0.5){
        vec2 d=uv-vec2(0.5); d.x*=uAspect; float dist=length(d);
        float front=uTime*0.55; float edge=smoothstep(0.18,0.0,abs(dist-front)); float decay=exp(-uTime*0.55);
        float wave=sin((dist-front)*42.0)*edge*0.09*decay;
        vec2 dir=dist>0.0001?normalize(d):vec2(0.0); uv+=dir*wave; dark=edge*decay*0.10;
      }
      vec2 c=uv-0.5; float r2=dot(c,c);
      float ca=0.0009+0.0052*r2;
      vec3 col;
      col.r=texture2D(tDiffuse,uv+c*ca).r;
      col.g=texture2D(tDiffuse,uv).g;
      col.b=texture2D(tDiffuse,uv-c*ca).b;
      col-=dark;
      col*=1.0-0.17*pow(clamp(r2*1.7,0.0,1.0),1.35);
      float g=fract(sin(dot(uv*vec2(1920.0,1080.0)+uClock*57.0,vec2(12.9898,78.233)))*43758.5453);
      col+=(g-0.5)*0.011;
      gl_FragColor=vec4(col,1.0);
    }`
};

/* ── a studio: dark room + bright softbox strips.
      Narrow strips are what give glass its long, sliding highlights. ── */
function studioEnv(){
  const s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(14,14,14),
    new THREE.MeshBasicMaterial({side:THREE.BackSide,color:0x080b12})));
  const box=(w,h,hex,mul,pos,rot)=>{
    const m=new THREE.MeshBasicMaterial({color:new THREE.Color(hex)});
    m.color.multiplyScalar(mul);
    const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);
    p.position.set(pos[0],pos[1],pos[2]);
    if(rot) p.rotation.set(rot[0],rot[1],rot[2]);
    s.add(p); return p;
  };
  box(7,7,0xffffff,5.2,[-4.2,3.6,3.0],[0,0.72,0]);        // big key, upper left
  box(0.7,9,0xeaf2ff,26.0,[5.0,0.4,1.4],[0,-1.02,0]);      // narrow rim strip, right
  box(0.5,7,0xffffff,17.0,[-1.2,4.6,-2.2],[1.35,0,0.4]);   // top edge streak
  box(9,4,0xf3f0ea,1.7,[0,-4.6,1.0],[-1.4,0,0]);           // dim bounce from below
  box(8,6,0xdfe8ff,1.1,[0,0.5,-6.0],[0,0,0]);              // back fill
  return s;
}

function init(){
  const canvas=document.getElementById('gl');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.85));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.06;
  if('transmissionResolutionScale' in renderer) renderer.transmissionResolutionScale=1.0;

  scene=new THREE.Scene(); scene.background=new THREE.Color(0xeef1f6);
  camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,0.1,100); camera.position.set(0,0,4.4);

  const pmrem=new THREE.PMREMGenerator(renderer);
  scene.environment=pmrem.fromScene(studioEnv(),0.015).texture;

  const key=new THREE.DirectionalLight(0xffffff,2.7); key.position.set(-1.6,3.4,2.6); scene.add(key);
  const fillL=new THREE.DirectionalLight(0xdfe6f5,0.30); fillL.position.set(1.5,-1.0,1.5); scene.add(fillL);
  const rim=new THREE.DirectionalLight(0xeaf0ff,0.9); rim.position.set(2.5,-2.5,1.5); scene.add(rim);

  // backdrop — something for the refraction to actually bend
  const cc=document.createElement('canvas'); cc.width=cc.height=768; const cg=cc.getContext('2d');
  const grd=cg.createLinearGradient(0,0,0,768);
  grd.addColorStop(0,'#dbe3ef'); grd.addColorStop(0.52,'#eef1f6'); grd.addColorStop(1,'#f6f7fa');
  cg.fillStyle=grd; cg.fillRect(0,0,768,768);
  const glow=cg.createRadialGradient(250,180,0,250,180,520);
  glow.addColorStop(0,'rgba(255,255,255,0.85)'); glow.addColorStop(1,'rgba(255,255,255,0)');
  cg.fillStyle=glow; cg.fillRect(0,0,768,768);
  const tex=new THREE.CanvasTexture(cc); tex.colorSpace=THREE.SRGBColorSpace;
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(26,26), new THREE.MeshBasicMaterial({map:tex}));
  bg.position.z=-6; scene.add(bg);

  caustic=new THREE.Mesh(new THREE.PlaneGeometry(7.2,7.2), CausticMat());
  caustic.position.z=-5.4; scene.add(caustic);

  group=new THREE.Group(); scene.add(group);

  // inner coloured liquid — MUST stay opaque: a transmissive core is invisible
  // once it sits inside the outer water (see web/README.md).
  const cgeo=new THREE.TorusGeometry(R,CTUBE,40,288);
  const cp=cgeo.attributes.position, col=[];
  for(let i=0;i<cp.count;i++){ const a=Math.atan2(cp.getY(i),cp.getX(i)); const c=colorAt(a/(Math.PI*2)+0.5); col.push(c.r,c.g,c.b); }
  cgeo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  core=new THREE.Mesh(cgeo,new THREE.MeshPhysicalMaterial({
    vertexColors:true, color:0xffffff, roughness:0.30, metalness:0,
    clearcoat:0.45, clearcoatRoughness:0.18, envMapIntensity:1.0 }));
  coreShader(core.material); group.add(core);


  // outer water — real dispersion, Beer-Lambert absorption, crisp refraction
  const geo=new THREE.TorusGeometry(R,TUBE,64,384);
  mat=new THREE.MeshPhysicalMaterial({ color:0xffffff, metalness:0, roughness:0.028,
    transmission:1.0, ior:1.333, thickness:0.72, dispersion:2.2,
    attenuationColor:new THREE.Color(0xa9dfec), attenuationDistance:1.45,
    clearcoat:1.0, clearcoatRoughness:0.015, envMapIntensity:2.1, transparent:true });
  waterShader(mat);
  torus=new THREE.Mesh(geo,mat); group.add(torus);

  // commit burst
  const sg=new THREE.BufferGeometry();
  const sp=new Float32Array(SMOKE*3), sc=new Float32Array(SMOKE*3);
  for(let i=0;i<SMOKE;i++){ const c=new THREE.Color().setHSL(0.62+Math.random()*0.06,0.7,0.55+Math.random()*0.15);
    sc[i*3]=c.r; sc[i*3+1]=c.g; sc[i*3+2]=c.b; smokeVel.push(new THREE.Vector3()); }
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3)); sg.setAttribute('color',new THREE.BufferAttribute(sc,3));
  smokePos=sg.attributes.position;
  smokeMat=new THREE.PointsMaterial({ size:0.24, map:softTex(), vertexColors:true, transparent:true, opacity:0,
    depthWrite:false, blending:THREE.NormalBlending, sizeAttenuation:true });
  smoke=new THREE.Points(sg,smokeMat); group.add(smoke);

  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.16,0.50,0.94);
  composer.addPass(bloomPass);
  finishPass=new ShaderPass(FinishShader);
  finishPass.uniforms.uAspect.value=innerWidth/innerHeight;
  composer.addPass(finishPass);
  composer.addPass(new OutputPass());

  clock=new THREE.Clock();
  addEventListener('resize',onResize);
  hit.addEventListener('pointerdown',onDown);
  addEventListener('pointerup',onUp); addEventListener('pointercancel',onUp);
  addEventListener('pointermove',e=>{ pointer.x=(e.clientX/innerWidth)*2-1; pointer.y=(e.clientY/innerHeight)*2-1; });
  document.addEventListener('mouseleave',()=>{ pointer.x=0; pointer.y=0; });
}
function onResize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
  bloomPass.setSize(innerWidth,innerHeight);
  finishPass.uniforms.uAspect.value=innerWidth/innerHeight; }

function onDown(e){ if(state!=='idle') return; hit.setPointerCapture(e.pointerId); state='holding'; holdStart=performance.now(); lastStage=-1; }
function onUp(){ if(state!=='holding') return; state='idle'; streak=0;
  zone.textContent='Hold to stay'; zone.style.color='var(--ink-dim)';
  setText(reveal, ABORTS[abortIx % ABORTS.length]); abortIx++; }
function onCommit(){ streak+=1; zone.textContent='Sent'; zone.style.color='#3a47c0';
  setText(reveal,'It is out. To all 340 of them.'); rippleActive=true; rippleT=0;
  for(let i=0;i<SMOKE;i++){ const a=Math.random()*Math.PI*2;
    smokePos.setXYZ(i,Math.cos(a)*R,Math.sin(a)*R,(Math.random()-0.5)*0.1);
    smokeVel[i].set(Math.cos(a)*(0.7+Math.random()*0.9),Math.sin(a)*(0.7+Math.random()*0.9),(Math.random()-0.5)*0.5); }
  smokePos.needsUpdate=true; smokeMat.opacity=0.85; smokeMat.size=0.20; }
function resetVisual(){ zone.textContent='Hold to stay'; zone.style.color='var(--ink-dim)';
  mat.opacity=1; torus.scale.set(1,1,1); smokeMat.opacity=0;
  setText(reveal,'Hold on a second. Let me show you who this really reaches.'); }

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(), t=clock.getElapsedTime(), dt=Math.min(clock.getDelta(),0.05);

  if(state==='holding'){
    const el=now-holdStart, p=Math.min(prog(el,segDur()),1), st=stageOf(p); press=p; fillV=p;
    zone.textContent=SEGS[st].label; zone.style.color=SEGS[st].color;
    if(st!==lastStage){ setText(reveal,SEGS[st].text); lastStage=st; }
    if(p>=1){ state='spreading'; spreadStart=now; onCommit(); }
  } else if(state==='spreading'){
    const s=Math.min((now-spreadStart)/2000,1);
    torus.scale.set(1+s*0.5, 1+s*0.5, Math.max(0.02,1-s*1.5));
    mat.opacity=Math.max(0,1-Math.max(0,(s-0.45))/0.55);
    if(core.material.userData.sh) core.material.userData.sh.uniforms.uThin.value=1;
    for(let i=0;i<SMOKE;i++){ smokePos.setXYZ(i, smokePos.getX(i)+smokeVel[i].x*dt*1.8, smokePos.getY(i)+smokeVel[i].y*dt*1.8, smokePos.getZ(i)+smokeVel[i].z*dt*1.8); }
    smokePos.needsUpdate=true; smokeMat.opacity=Math.max(0,0.85*(1-s)); smokeMat.size=0.20+s*0.4;
    if(s>=1){ state='idle'; resetVisual(); press=0; fillV=0; }
  } else { press+=(0-press)*0.08; fillV+=(0-fillV)*0.10; }

  if(state!=='spreading'){ if(core.material.userData.sh) core.material.userData.sh.uniforms.uThin.value=press; }


  if(mat.userData.sh){ mat.userData.sh.uniforms.uTime.value=t; mat.userData.sh.uniforms.uFill.value=fillV; }
  if(core.material.userData.sh) core.material.userData.sh.uniforms.uTime.value=t;
  caustic.material.uniforms.uTime.value=t;
  caustic.material.uniforms.uGain.value=0.55+fillV*0.9;

  rot.y+=((pointer.x*0.42)-rot.y)*0.06; rot.x+=((-pointer.y*0.30)-rot.x)*0.06;
  group.rotation.set(rot.x,rot.y,0);

  if(rippleActive){ rippleT+=dt; finishPass.uniforms.uActive.value=1; finishPass.uniforms.uTime.value=rippleT;
    if(rippleT>3.2){ rippleActive=false; finishPass.uniforms.uActive.value=0; } }
  finishPass.uniforms.uClock.value=t;

  for(let i=0;i<stepFills.length;i++){ const f=Math.max(0,Math.min(1,(press-i/3)*3)); stepFills[i].style.width=(f*100)+'%'; }

  composer.render();
}
try { init(); animate(); } catch(e){ const f=document.getElementById('fallback'); f.style.display='flex'; f.textContent='Error: '+(e&&e.message?e.message:e); console.error(e); }
</script>
</body>
