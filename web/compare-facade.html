<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DWELL — Three Conditions (preview)</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Framer Embed (Type: URL) loads this page. Nothing heavy runs until the
     click: the live comparison (WebGL) is only created then. The poster uses
     the demo's own background, so the hand-off to the live page is seamless. */
  /* --bg is the tone the demo actually RENDERS (#e1e1e0 after tone mapping),
     not its CSS #f1efe9 -- that is what makes the hand-off seamless */
  :root{ --bg:#e1e1e0; --ink:#2a3038; --ink-dim:#5c646f; --ink-faint:#636b76; --sans:'Inter',system-ui,sans-serif; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%; background:var(--bg); overflow:hidden}
  .facade{position:relative; width:100%; height:100%; font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 90% at 50% 45%, #e3e3e2 0%, #e1e1e0 55%, #d9d9d8 100%)}

  .poster{position:absolute; inset:0; width:100%; height:100%; border:0; background:none; font:inherit; color:inherit; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(18px,3.2vh,34px); padding:4vh 4vw;
    transition:opacity .5s ease}
  .poster.out{opacity:0; pointer-events:none}
  .poster:focus-visible{outline:none}
  .poster:focus-visible .cta{outline:2px solid #3a47c0; outline-offset:4px}

  .head{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center}
  .eyebrow{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--ink-faint)}
  .title{font-size:clamp(22px,2.6vw,30px); font-weight:500; line-height:1.25}
  .sub{font-size:clamp(13px,1.2vw,15px); color:var(--ink-dim)}

  .row{display:flex; align-items:flex-end; justify-content:center; gap:clamp(12px,3vw,48px); width:100%}
  .tile{display:flex; flex-direction:column; align-items:center; gap:10px; width:clamp(120px,22vw,300px)}
  .tile img{width:100%; aspect-ratio:1; display:block; user-select:none; pointer-events:none;
    /* the captures carry the demo's own backdrop; feather their edges into this one */
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
            mask-image:radial-gradient(circle at 50% 50%, #000 52%, transparent 71%);
    animation:float 6.5s ease-in-out infinite; transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .tile:nth-child(2) img{animation-delay:-2.1s}
  .tile:nth-child(3) img{animation-delay:-4.3s}
  .poster:hover .tile img{transform:translateY(-6px) scale(1.03)}
  .tag{font-size:12px; letter-spacing:.04em; color:var(--ink-dim); padding:7px 13px; border-radius:999px;
    border:1px solid rgba(42,48,56,.16); background:rgba(255,255,255,.55); white-space:nowrap}
  .tag b{font-weight:500}
  /* the three are a progression: a faint line runs under them, 1 -> 2 -> 3 */
  .rail{width:min(66vw,760px); height:1px; background:linear-gradient(90deg,transparent,rgba(42,48,56,.22),transparent); margin-top:-6px}

  .cta{display:inline-flex; align-items:center; gap:10px; font-size:15px; font-weight:500; color:#fff; background:var(--ink);
    padding:14px 24px; border-radius:999px; box-shadow:0 10px 30px rgba(20,30,50,.16); transition:transform .25s ease, box-shadow .25s ease}
  .cta .arr{display:inline-block; transition:transform .25s ease}
  .poster:hover .cta{transform:translateY(-1px); box-shadow:0 14px 34px rgba(20,30,50,.22)}
  .poster:hover .cta .arr{transform:translateX(4px)}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:-8px}
  /* loading: the arrow becomes a thin running line, so the wait reads as progress */
  .cta .bar{display:none; width:44px; height:2px; border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden; position:relative}
  .cta .bar::after{content:""; position:absolute; inset:0; width:40%; background:#fff; border-radius:2px; animation:run 1s ease-in-out infinite}
  .poster.loading .cta .arr{display:none}
  .poster.loading .cta .bar{display:block}

  .live{position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; transition:opacity .5s ease}
  .live.in{opacity:1}

  @keyframes float{0%,100%{translate:0 0} 50%{translate:0 -5px}}
  @keyframes run{0%{transform:translateX(-100%)} 100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion: reduce){ .tile img{animation:none} .cta .bar::after{animation:none; width:100%} }
  @media (max-width:560px){ .tag{font-size:11px; padding:6px 9px} .hint{display:none} }
</style>
</head>
<body>
<div class="facade" id="facade">
  <button class="poster" id="poster" aria-label="Try the live comparison: three ways to confirm the same send">
    <span class="head">
      <span class="eyebrow">DWELL · Three conditions</span>
      <span class="title">Same send, three gates.</span>
      <span class="sub">Send it each way, in order. The page times how long you stay with who it reaches.</span>
    </span>
    <span class="row">
      <span class="tile"><img src="facade/a.png" alt=""/><span class="tag"><b>1</b> No friction</span></span>
      <span class="tile"><img src="facade/b.png" alt=""/><span class="tag"><b>2</b> Screen friction</span></span>
      <span class="tile"><img src="facade/c.png" alt=""/><span class="tag"><b>3</b> Tangible</span></span>
    </span>
    <span class="rail"></span>
    <span class="cta"><span class="lbl">Try the live comparison</span><span class="arr">→</span><span class="bar"></span></span>
    <span class="hint">About a minute · works with mouse, touch or keyboard</span>
  </button>
</div>

<script>
// Same origin as the demo, so no redirect hop.
const IFRAME_SRC = 'compare.html';

const facade=document.getElementById('facade'), poster=document.getElementById('poster');
let activated=false;
function activate(){
  if(activated) return; activated=true;
  poster.classList.add('loading'); poster.querySelector('.lbl').textContent='Loading';
  const f=document.createElement('iframe');
  f.className='live'; f.src=IFRAME_SRC; f.title='DWELL live comparison'; f.allow='fullscreen';
  facade.insertBefore(f, poster);             // underneath: the poster fades off it
  let shown=false;
  const show=()=>{ if(shown) return; shown=true; f.classList.add('in'); poster.classList.add('out');
    setTimeout(()=>{ poster.remove(); f.focus(); },520); };
  // give WebGL a beat to draw its first frame before revealing it
  f.addEventListener('load',()=>setTimeout(show,700));
  setTimeout(show,6000);                      // never leave anyone on "Loading"
}
poster.addEventListener('click',activate);
</script>
</body>
</html>
